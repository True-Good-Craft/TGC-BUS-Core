name: Security Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install "bandit==1.9.4"

      - name: Bandit full report, Low+ advisory
        continue-on-error: true
        run: |
          bandit -r core tgc scripts fuzz launcher.py \
            -x "tests,build,dist,.venv,.pytest_cache,.tmp_test_deps_*,.tmp_localappdata_*,.gate-pytest-*,.artifacts" \
            --severity-level low \
            --confidence-level low

      - name: Bandit blocking scan, Medium/High
        run: |
          bandit -r core tgc scripts fuzz launcher.py \
            -x "tests,build,dist,.venv,.pytest_cache,.tmp_test_deps_*,.tmp_localappdata_*,.gate-pytest-*,.artifacts" \
            --severity-level medium \
            --confidence-level low

  dependency-audit:
    name: Dependency audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            lockfile: requirements-linux.lock.txt
            test-lockfile: requirements-test-linux.lock.txt
            fuzz-lockfile: requirements-fuzz-linux.lock.txt
          - os: windows-latest
            python-version: "3.11"
            lockfile: requirements-windows.lock.txt
            test-lockfile: requirements-test-windows.lock.txt
            fuzz-lockfile: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pip-audit
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install "pip-audit==2.10.1"

      - name: Audit locked runtime dependencies
        run: >-
          python -m pip_audit
          --require-hashes
          -r "${{ matrix.lockfile }}"
          --cache-dir "${{ runner.temp }}/pip-audit"
          --progress-spinner off

      - name: Audit locked test dependencies
        run: >-
          python -m pip_audit
          --require-hashes
          -r "${{ matrix.test-lockfile }}"
          --cache-dir "${{ runner.temp }}/pip-audit"
          --progress-spinner off

      - name: Audit locked Linux fuzz dependencies
        if: matrix.fuzz-lockfile != ''
        run: >-
          python -m pip_audit
          --require-hashes
          -r "${{ matrix.fuzz-lockfile }}"
          --cache-dir "${{ runner.temp }}/pip-audit"
          --progress-spinner off
