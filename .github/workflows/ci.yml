name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            lockfile: requirements-linux.lock.txt
            test-lockfile: requirements-test-linux.lock.txt
            fuzz-lockfile: requirements-fuzz-linux.lock.txt
          - os: windows-latest
            python-version: "3.11"
            lockfile: requirements-windows.lock.txt
            test-lockfile: requirements-test-windows.lock.txt
            fuzz-lockfile: ""

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install locked runtime and test tooling
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install --require-hashes -r "${{ matrix.lockfile }}"
          python -m pip install --require-hashes -r "${{ matrix.test-lockfile }}"
          python -m pip check

      - name: Install locked Linux fuzz tooling
        if: matrix.fuzz-lockfile != ''
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r "${{ matrix.fuzz-lockfile }}"
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q core tgc scripts fuzz launcher.py

      - name: Run tests
        run: python -m pytest -q

      - name: Run bounded Atheris harnesses
        if: matrix.fuzz-lockfile != ''
        run: |
          python fuzz/fuzz_manifest.py -atheris_runs=512 -max_len=65537 -timeout=5 -rss_limit_mb=1024 -seed=1
          python fuzz/fuzz_paths_zip.py -atheris_runs=512 -max_len=1027 -timeout=5 -rss_limit_mb=1024 -seed=1
